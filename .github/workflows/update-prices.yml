name: update-prices

on:
  schedule:
    - cron: "20 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect prices from KSH
        run: |
          python collect_prices_ksh.py basket.json prices.json

      - name: Collect SH admissions
        run: |
          python collect_sh_admissions.py sh_admissions.json

      - name: Commit and push if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json sh_admissions.json collect_sh_admissions.py
          git diff --cached --quiet || (git commit -m "Update prices.json and sh_admissions.json" && git push)
